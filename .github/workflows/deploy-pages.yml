name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vue example
        uses: actions/checkout@v4

      - name: Check out SatSimJS source
        uses: actions/checkout@v4
        with:
          repository: ssc-ai/satsimjs
          path: .satsimjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vue example dependencies
        run: npm ci --no-audit --no-fund

      - name: Install SatSimJS source dependencies
        working-directory: .satsimjs
        run: npm install --no-audit --no-fund

      - name: Build Vue example
        env:
          SATSIMJS_ROOT: .satsimjs
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
